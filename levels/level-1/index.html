<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sanskrit Escape Room - Level 1</title>

    <link rel="stylesheet" href="css/level.css" />
  </head>

  <body>
    <main class="game">
      <!-- =========================
         HEADER
    ========================== -->

      <header class="game-header">
        <p class="level-label">LEVEL 1</p>

        <h1>Sanskrit Escape Room</h1>

        <p class="intro">
          You are locked inside the study room. Follow the clues, find the key,
          and escape!
        </p>
      </header>

      <!-- =========================
         CURRENT CLUE
    ========================== -->

      <section class="clue-box">
        <p class="clue-label">YOUR CLUE</p>

        <h2 id="sanskritWord">पुस्तकम्</h2>

        <p id="englishClue">Find the green book.</p>

        <p id="feedback" aria-live="polite"></p>
      </section>

      <!-- =========================
         ROOM
    ========================== -->

      <section class="room-scroll">
        <div class="room-container">
          <svg
            id="roomMap"
            viewBox="0 0 1672 941"
            preserveAspectRatio="xMidYMid meet"
            xmlns="http://www.w3.org/2000/svg"
          >
            <!--
            THIS IS THE ONLY VISIBLE ROOM IMAGE.
            No separate object images are added.
          -->

            <image
              href="../../assets/images/level1-bg.png"
              x="0"
              y="0"
              width="1672"
              height="941"
            />

            <!-- =========================
               CORRECT GREEN BOOK

               Lower bookshelf.
               Standing green book immediately
               left of the flower pot.
          ========================== -->

            <polygon
              class="hotspot"
              data-object="book"
              points="
              865,414
              891,408
              899,476
              875,489
              865,484
            "
            />

            <!-- =========================
               OTHER LOWER BOOKS

               These do NOT count as
               the correct book.
          ========================== -->

            <polygon
              class="hotspot"
              data-object="other-book"
              points="
              808,400
              862,399
              867,484
              809,489
            "
            />

            <!-- Horizontal books right of plant -->

            <polygon
              class="hotspot"
              data-object="other-book"
              points="
              966,445
              1071,446
              1071,495
              964,494
            "
            />

            <!-- Top shelf books -->

            <polygon
              class="hotspot"
              data-object="other-book"
              points="
              810,158
              914,164
              914,249
              809,249
            "
            />

            <!-- =========================
               FLOWER POT
          ========================== -->

            <polygon
              class="hotspot"
              data-object="plant"
              points="
              897,398
              930,392
              955,420
              950,483
              904,489
              895,445
            "
            />

            <!-- =========================
               LAMP
          ========================== -->

            <polygon
              class="hotspot"
              data-object="lamp"
              points="
              33,398
              72,397
              91,356
              119,328
              143,313
              148,277
              169,248
              205,251
              226,279
              226,309
              205,331
              168,340
              128,353
              101,383
              92,429
              42,435
            "
            />

            <!-- =========================
               CHAIR
          ========================== -->

            <polygon
              class="hotspot"
              data-object="chair"
              points="
              452,388
              536,402
              529,531
              514,649
              510,730
              454,731
              449,625
              304,624
              299,558
              447,529
            "
            />

            <!-- =========================
               TREASURE CHEST
          ========================== -->

            <polygon
              class="hotspot"
              data-object="chest"
              points="
              0,755
              289,742
              350,770
              369,815
              363,941
              0,941
            "
            />

            <!-- =========================
               DOOR
          ========================== -->

            <polygon
              class="hotspot"
              data-object="door"
              points="
              1363,63
              1581,0
              1642,0
              1642,719
              1370,642
            "
            />

            <!-- =========================
               DISTRACTOR: GLOBE
          ========================== -->

            <circle
              class="hotspot"
              data-object="globe"
              cx="1033"
              cy="206"
              r="49"
            />

            <!-- =========================
               DISTRACTOR: CLOCK
          ========================== -->

            <circle
              class="hotspot"
              data-object="clock"
              cx="1220"
              cy="111"
              r="67"
            />

            <!-- =========================
               DISTRACTOR: DRAWERS
          ========================== -->

            <polygon
              class="hotspot"
              data-object="drawers"
              points="
              1105,421
              1288,420
              1285,638
              1107,642
            "
            />
          </svg>
        </div>
      </section>

      <!-- =========================
         PROGRESS / STORY STEPS
    ========================== -->

      <section class="progress" aria-label="Level progress">
        <div class="step active" data-step="book">
          <span>1</span>
          <strong>Book</strong>
        </div>

        <div class="step locked" data-step="lamp">
          <span>2</span>
          <strong>Lamp</strong>
        </div>

        <div class="step locked" data-step="chair">
          <span>3</span>
          <strong>Chair</strong>
        </div>

        <div class="step locked" data-step="chest">
          <span>4</span>
          <strong>Key</strong>
        </div>

        <div class="step locked" data-step="door">
          <span>5</span>
          <strong>Door</strong>
        </div>
      </section>
    </main>

    <!-- =========================
       STORY POPUP
  ========================== -->

    <div id="storyPopup" class="popup hidden">
      <div class="popup-card">
        <div class="popup-icon">🔎</div>

        <h2 id="popupTitle">Great!</h2>

        <p id="popupMessage"></p>

        <button id="continueButton" type="button">Continue</button>
      </div>
    </div>

    <!-- =========================
       JAVASCRIPT
  ========================== -->

    <script type="module" src="js/level.js"></script>
  </body>
</html>
